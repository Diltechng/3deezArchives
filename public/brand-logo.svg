<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="lumina-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="lumina-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F56D9" />
      <stop offset="100%" stop-color="#9E77ED" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="420" height="120" rx="16" fill="#0D1117"/>

  <!-- Icon Mark: Rounded Prism Aperture L -->
  <g transform="translate(30, 20)">
    <!-- Back Shard (Violet) -->
    <path d="M 29 10 L 61 10 Q 65 10 63.8 14.2 L 46.2 75.8 Q 45 80 41 80 L 9 80 Q 5 80 6.2 75.8 L 23.8 14.2 Q 25 10 29 10 Z" 
          fill="url(#lumina-purple)" 
          stroke="url(#lumina-purple)" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Front Shard (Cyan L-Beam) -->
    <path d="M 15 30 Q 15 25 20 25 L 51 25 Q 55 25 53.8 29.2 L 37.8 57.2 Q 36 60 40 60 L 71 60 Q 75 60 73.8 64.2 L 66.8 78.2 Q 65 80 61 80 L 20 80 Q 15 80 15 75 Z" 
          fill="url(#lumina-cyan)" 
          stroke="url(#lumina-cyan)" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Core Focal Light Dot -->
    <circle cx="68" cy="23" r="5" fill="#00F2FE" />
  </g>

  <!-- Brand Typography -->
  <text x="135" y="72" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="42" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#FFFFFF">LUMINA</text>

  <!-- Subtitle Tag -->
  <text x="350" y="72" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#00F2FE">HQ</text>
</svg>
