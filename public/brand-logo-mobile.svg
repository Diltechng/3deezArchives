      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="lumina-purple-mobile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F56D9" />
      <stop offset="100%" stop-color="#9E77ED" />
    </linearGradient>
  </defs>

  <!-- App Icon Card Container -->
  <rect width="128" height="128" rx="28" fill="#0D1117"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

